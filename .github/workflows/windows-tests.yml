name: Windows tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies (no model downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,ai,openvino,ocr]"
      - name: Run all synthetic / fake-backend tests
        env:
          SEEKDEX_HOME: ${{ runner.temp }}/seekdex-tests
        run: python -m pytest -q
