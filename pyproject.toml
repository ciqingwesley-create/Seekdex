[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seekdex"
dynamic = ["version"]
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT.md", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "ciqing wesley", email = "ciqing.wesley@gmail.com"}]
description = "Local-first intelligent file and image search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "Pillow>=10.4,<12",
    "rawpy>=0.27,<0.28",
    "ExifRead>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.20,<7", "pefile>=2024.8.26"]
ai = ["torch>=2.6,<3", "transformers>=4.48,<5", "huggingface-hub>=0.30,<1", "safetensors>=0.5,<1", "numpy>=2,<3"]
openvino = ["openvino>=2025.0,<2027"]
ocr = ["rapidocr==3.9.2", "onnxruntime>=1.23,<2"]

[project.gui-scripts]
seekdex = "seekdex.app:main"

[project.urls]
Homepage = "https://github.com/ciqingwesley-create/Seekdex"
Source = "https://github.com/ciqingwesley-create/Seekdex"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "seekdex.app_info.PACKAGE_VERSION"}

[tool.setuptools.package-data]
seekdex = ["resources/*", "resources/licenses/**/*", "resources/compliance/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
